  notify-discord:
    needs: [scrape-adc-deep-1, scrape-adc-deep-2, scrape-adc-deep-3, scrape-adc-deep-4, scrape-support-deep-1, scrape-support-deep-2, scrape-support-deep-3, scrape-support-deep-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ADC1: ${{ needs.scrape-adc-deep-1.result }}
          ADC2: ${{ needs.scrape-adc-deep-2.result }}
          ADC3: ${{ needs.scrape-adc-deep-3.result }}
          ADC4: ${{ needs.scrape-adc-deep-4.result }}
          SUP1: ${{ needs.scrape-support-deep-1.result }}
          SUP2: ${{ needs.scrape-support-deep-2.result }}
          SUP3: ${{ needs.scrape-support-deep-3.result }}
          SUP4: ${{ needs.scrape-support-deep-4.result }}
          PATCH: ${{ env.LOLALYTICS_PATCH }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set; skipping Discord notification."
            exit 0
          fi
          FAIL=0
          for R in "$ADC1" "$ADC2" "$ADC3" "$ADC4" "$SUP1" "$SUP2" "$SUP3" "$SUP4"; do
            if [ "$R" != "success" ]; then FAIL=1; fi
          done
          if [ "$FAIL" -eq 0 ]; then ICON="✅"; STATUS="success"; else ICON="❌"; STATUS="failure"; fi
          RUN_URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          MSG="$ICON Deep botlane lookup $STATUS (patch $PATCH). adc: $ADC1,$ADC2,$ADC3,$ADC4 support: $SUP1,$SUP2,$SUP3,$SUP4. $RUN_URL"
          curl -fsS -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$MSG\"}" || true
