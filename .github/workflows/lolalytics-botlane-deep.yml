name: Deep Botlane Lookup

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch to scrape (e.g. 26.4)"
        required: false
        default: ""

env:
  LOLALYTICS_PATCH: ${{ github.event.inputs.patch || vars.LOLALYTICS_PATCH || '26.6' }}
  LOLALYTICS_BOTLANE_MAX_CHAMPIONS: ${{ vars.LOLALYTICS_BOTLANE_MAX_CHAMPIONS || '0' }}
  LOLALYTICS_REQUEST_DELAY_MS: ${{ vars.LOLALYTICS_REQUEST_DELAY_MS || '120' }}
  # 172 champs = 29,412 pairs total. 4 chunks of 7500 covers all of them with margin.
  BOTLANE_CHUNK_PAIRS: "7500"

jobs:
  scrape-adc-deep-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required."
            exit 1
          fi
      - name: Scrape ADC (deep) chunk 1
        env:
          DB_PROVIDER: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CURRENT_PATCH: ${{ env.LOLALYTICS_PATCH }}
        run: |
          EXTRA_ARGS="--startIndex 0 --maxPairs $BOTLANE_CHUNK_PAIRS"
          npm run scrape:lolalytics -- \
            --patch "$LOLALYTICS_PATCH" \
            --lane adc \
            --allChampions \
            $EXTRA_ARGS \
            --requestDelayMs "$LOLALYTICS_REQUEST_DELAY_MS"
      - name: Discord notification (adc deep chunk 1)
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ROLE_STATUS: ${{ job.status }}
          PATCH: ${{ env.LOLALYTICS_PATCH }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then exit 0; fi
          ICON=$([ "$ROLE_STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -fsS -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$ICON Deep botlane ADC chunk 1/4 $ROLE_STATUS (patch $PATCH). https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" || true

  scrape-adc-deep-2:
    needs: scrape-adc-deep-1
