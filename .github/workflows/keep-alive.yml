name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL not set; skipping."
            exit 0
          fi
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" || echo "failed")
          echo "Health check status: $STATUS"
